services:
  - type: web
    name: attendance-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/download_models.py
    startCommand: cd backend && python seed.py && gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://attendance-web-amdn.onrender.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_TEACHER_PASSWORD
        generateValue: true
      - key: SEED_TEACHER2_PASSWORD
        generateValue: true
      - key: SEED_STUDENT_PASSWORD
        generateValue: true
      - key: SEED_STUDENT2_PASSWORD
        generateValue: true
      - key: SEED_STUDENT3_PASSWORD
        generateValue: true
      - key: SEED_STUDENT4_PASSWORD
        generateValue: true

  - type: web
    name: attendance-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: attendance-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
